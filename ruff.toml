# Ruff linter and formatter configuration for ConversionBridge
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # Do not perform function call in argument defaults (standard in FastAPI Depends)
    "E501", # Line too long (handled by formatter)
]

[lint.isort]
known-first-party = ["app"]
